name: Build web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vravio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: raster, repo: photocraft }
          - { kind: vector, repo: vectorcraft }
          - { kind: audio, repo: soundcraft }
          - { kind: video, repo: filmcraft }
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/${{ matrix.repo }}
      - name: Install Trunk
        if: matrix.kind != 'video'
        run: cargo install trunk --locked
      - name: Install wasm-bindgen
        if: matrix.kind == 'video'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build editor
        shell: pwsh
        run: ./build-editor.ps1 -Kind ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.kind }}
          path: dist/editors
          compression-level: 0
  build:
    runs-on: ubuntu-latest
    needs: editor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          path: dist/editors
          merge-multiple: true
      - name: Package shell and notices
        shell: pwsh
        run: |
          ./build-web.ps1 -ShellOnly
          foreach ($kind in @('raster','vector','audio','video')) {
            if (-not (Test-Path "dist/editors/$kind/index.html")) { throw "Missing $kind editor" }
          }
          foreach ($repo in @('photocraft','vectorcraft','filmcraft','soundcraft')) {
            $target = "dist/third-party-notices/$repo"
            New-Item -ItemType Directory -Force $target | Out-Null
            foreach ($name in @('LICENSE-MIT','LICENSE-APACHE','NOTICE')) {
              Copy-Item "upstream/$repo/$name" $target -Force
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config restorer/vite.config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: vravio-web-bundle
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  desktop:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vravio-web-bundle
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vravio-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
