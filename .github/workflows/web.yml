name: Build web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vravio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: raster, repo: photocraft }
          - { kind: vector, repo: vectorcraft }
          - { kind: audio, repo: soundcraft }
          - { kind: video, repo: filmcraft }
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Apply the VRAVIO patches first so the cache key covers the sources trunk would actually build.
      - name: Apply VRAVIO patches
        shell: pwsh
        run: ./brand-editors.ps1
      - name: Hash editor sources
        id: src
        shell: bash
        run: |
          repo="upstream/${{ matrix.repo }}"
          hash=$(
            {
              echo "kind=${{ matrix.kind }} trunk=latest wasm-bindgen=0.2.129"
              rustc -V
              git -C "$repo" rev-parse HEAD
              git -C "$repo" submodule status --recursive
              git -C "$repo" diff HEAD --binary
              git -C "$repo" ls-files -z --others --exclude-standard | (cd "$repo" && xargs -0 -r sha256sum)
              sha256sum build-editor.ps1 font-catalog/manifest.txt                 src-tauri/icons/icon.png src-tauri/icons/32x32.png src-tauri/icons/128x128@2x.png                 "assets/логотип цветная плашка.svg"
            } | sha256sum | cut -c1-40
          )
          echo "key=web-editor-${{ matrix.kind }}-$hash" >> "$GITHUB_OUTPUT"
          echo "Editor source key: web-editor-${{ matrix.kind }}-$hash"
      - name: Restore built editor
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist/editors/${{ matrix.kind }}
          key: ${{ steps.src.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          workspaces: upstream/${{ matrix.repo }}
      - name: Install Trunk
        if: steps.cache.outputs.cache-hit != 'true' && matrix.kind != 'video'
        run: cargo install trunk --locked
      - name: Install wasm-bindgen
        if: steps.cache.outputs.cache-hit != 'true' && matrix.kind == 'video'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build editor
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build-editor.ps1 -Kind ${{ matrix.kind }}
      - name: Save built editor
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/editors/${{ matrix.kind }}
          key: ${{ steps.src.outputs.key }}
      - name: Check editor bundle
        shell: bash
        run: test -f "dist/editors/${{ matrix.kind }}/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.kind }}
          path: dist/editors
          compression-level: 0
  build:
    runs-on: ubuntu-latest
    needs: editor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          path: dist/editors
          merge-multiple: true
      - name: Package shell and notices
        shell: pwsh
        run: |
          ./build-web.ps1 -ShellOnly
          foreach ($kind in @('raster','vector','audio','video')) {
            if (-not (Test-Path "dist/editors/$kind/index.html")) { throw "Missing $kind editor" }
          }
          foreach ($repo in @('photocraft','vectorcraft','filmcraft','soundcraft')) {
            $target = "dist/third-party-notices/$repo"
            New-Item -ItemType Directory -Force $target | Out-Null
            foreach ($name in @('LICENSE-MIT','LICENSE-APACHE','NOTICE')) {
              Copy-Item "upstream/$repo/$name" $target -Force
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config restorer/vite.config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: vravio-web-bundle
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  desktop:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vravio-web-bundle
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vravio-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
  desktop-macos:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vravio-web-bundle
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles dmg --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vravio-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
